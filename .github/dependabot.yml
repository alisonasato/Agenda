version: 2
updates:
  # Atualizações de minor/patch chegam juntas em um PR por semana; majors vêm separados.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Fixados para se comportar como no site original; majors só quando alguém decidir migrar.
    ignore:
      - dependency-name: intl-tel-input
        update-types: ["version-update:semver-major"]
      - dependency-name: ckeditor5
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
